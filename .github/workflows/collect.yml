name: SCADA 압력데이터 자동 수집

on:
  schedule:
    # 15분마다 실행 (UTC 기준 cron이므로 한국시간과 무관하게 15분 간격 자체는 동일함)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # 수동 실행 버튼도 활성화 (테스트용)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 73개소 처리가 오래 걸리면 다음 실행과 겹치지 않도록 타임아웃 설정

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Firebase 서비스 계정 키 파일 생성
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-key.json

      - name: 수집 스크립트 실행
        env:
          SCADA_USERNAME: ${{ secrets.SCADA_USERNAME }}
          SCADA_PASSWORD: ${{ secrets.SCADA_PASSWORD }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: python collect_all.py --minutes 20

      - name: 서비스 계정 키 파일 삭제
        if: always()
        run: rm -f /tmp/firebase-key.json
